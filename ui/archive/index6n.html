<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Omni Upgrade Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root {
      --bg: #0b0f16;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --card: #111827;
      --border: #273449;
      --table: #0f172a;
      --accent: #374151;
      --accent-strong: #1f2937;
      --spinner: #9ca3af;
    }
    .light { --bg:#fff; --fg:#111827; --muted:#6b7280; --card:#fff; --border:#e5e7eb; --table:#fff; --accent:#f3f4f6; --accent-strong:#e5e7eb; --spinner:#6b7280; }
    body { font-family: system-ui, Segoe UI, Roboto, sans-serif; margin:16px; background:var(--bg); color:var(--fg); }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .row-between { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .box { border:1px solid var(--border); background:var(--card); border-radius:10px; padding:12px; margin:8px 0; }
    table { width:100%; border-collapse:collapse; background:var(--table); }
    th, td { padding:8px; border-bottom:1px solid var(--border); text-align:left; }
    .status { padding:2px 8px; border-radius:999px; font-size:12px; display:inline-flex; align-items:center; gap:6px; }
    .s-sending { background:#854d0e; color:#fde68a; }
    .s-rebooting { background:#1e3a8a; color:#bfdbfe; }
    .s-idle { background:#14532d; color:#bbf7d0; }
    .s-idle-unchanged { background:#374151; color:#e5e7eb; }
    .btn { padding:8px 12px; border-radius:8px; border:1px solid var(--border); cursor:pointer; background:var(--accent); color:var(--fg); }
    .btn:hover { filter: brightness(1.1); }
    select, input, button { font-size:14px; color:var(--fg); background:var(--card); border:1px solid var(--border); padding:6px 8px; border-radius:6px; }
    .small { font-size:12px; color:var(--muted); }
    .w80 { width:80px; } .w120 { width:120px; } .w160 { width:160px; } .w240 { width:240px; }
    label.toggle { display:flex; align-items:center; gap:8px; user-select:none; cursor:pointer; }
    .switch { position:relative; width:44px; height:24px; background:var(--border); border-radius:999px; }
    .knob { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--fg); transition:left .15s; }
    .switch.on .knob { left:22px; }
    .pill { padding:4px 10px; border-radius:999px; background:var(--accent-strong); color:var(--fg); }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--spinner); border-top-color:transparent; border-radius:50%; animation: spin .8s linear infinite; vertical-align:-2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spacer { flex:1; }
  </style>
</head>
<body>
  <h2>Omni Upgrade Manager</h2>

  <div class="box">
    <div class="row">
      <label>Username <input id="username" value="admin" class="w120"/></label>
      <label>Password <input id="password" value="Atlona" class="w120" type="password"/></label>
      <label>WS PORT
        <select id="ws_port" class="w120">
          <option value="80" selected>80 (ws)</option>
          <option value="443">443 (wss)</option>
        </select>
      </label>
      <label class="toggle">
        <div>Dark mode</div>
        <div id="dark_switch" class="switch on"><div class="knob"></div></div>
      </label>
      <label>Parallel uploads
        <select id="concurrency" class="w80">
          <option>1</option><option>2</option><option>4</option><option selected>6</option><option>8</option><option>12</option>
        </select>
      </label>
      <button class="btn" id="apply">Apply Config</button>
      <span id="cfg_status" class="small"></span>
    </div>
  </div>

  <div class="box">
    <div class="row" style="gap:16px;">
      <div>
        <div class="small">Adapters</div>
        <select id="adapters" class="w240"><option value="">(loading adapters...)</option></select>
      </div>
      <div>
        <div class="small">Targets (free-form). If empty, uses selected adapter range.</div>
        <input id="targets" class="w240" placeholder="e.g. 192.168.100.1-254, or 192.168.100.0/24, or IPs"/>
      </div>
      <button class="btn" id="scan">Scan</button>
      <button class="btn" id="clear_units">Clear Units</button>
      <span id="scan_status" class="small pill"></span>
    </div>
  </div>

  <div class="box">
    <div class="row-between">
      <div class="row">
        <div>
          <div class="small">Firmware (.vpup2 in application folder)</div>
          <select id="files" class="w240"></select>
          <div class="small" style="margin-top:6px;">select the firmware for the unit type you are wanting to view</div>
        </div>
        <button class="btn" id="refresh_files">Refresh Files</button>
        <button class="btn" id="upgrade_sel">Upgrade Selected</button>
        <span id="up_status" class="small"></span>
      </div>
      <div class="row" style="justify-content:center;">
        <button class="btn" id="export_units">Export Units</button>
      </div>
    </div>
  </div>

  <div class="box">
    <table id="tbl">
      <thead>
        <tr>
          <th><input type="checkbox" id="chk_all"/></th>
          <th>IP</th><th>MAC</th><th>Hostname</th><th>Model</th><th>Version</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

<script>
const $ = sel => document.querySelector(sel);
const api = (p, opt={}) => fetch(p, opt).then(r => r.json());

function applyTheme(){ const dark = localStorage.getItem("dark") !== "false"; document.body.classList.toggle("light", !dark); $("#dark_switch").classList.toggle("on", dark); }
function toggleDark(){ const isOn = $("#dark_switch").classList.contains("on"); localStorage.setItem("dark", (!isOn).toString()); applyTheme(); }

let units = []; const unitMap = new Map();
const MODEL_SETS = {
  omni2:new Set(["at-omni-d4111","at-omni-d4511","at-omni-e4521","at-omni-e4111-wp","at-omni-e4111"]),
  dual:new Set(["at-omni-112","at-omni-122"]),
  single:new Set(["at-omni-111","at-omni-121","at-omni-111-wp"]),
  residential:new Set(["at-omni-512","at-omni-521"]),
};
function filenameKeywords(){ const f = ($("#files").value||"").toLowerCase(); const keys=[]; for(const k of Object.keys(MODEL_SETS)){ if(f.includes(k)) keys.push(k);} return keys; }
function filteredUnits(){ const keys=filenameKeywords(); if(!keys.length) return units; const allow=new Set(); keys.forEach(k=>MODEL_SETS[k].forEach(m=>allow.add(m))); return units.filter(u=>allow.has((u.model||'').toLowerCase())); }
function statusBadge(text, cls, spin=false){ const span=document.createElement('span'); span.className=`status ${cls}`; const t=document.createElement('span'); t.textContent=text; span.appendChild(t); if(spin){ const s=document.createElement('span'); s.className='spinner'; s.style.width='12px'; s.style.height='12px'; s.style.borderWidth='2px'; span.appendChild(s);} return span; }
function renderRows(list){ const tb=$("#tbody"); tb.innerHTML=""; list.forEach(u=>{ const tr=document.createElement('tr'); tr.dataset.ip=u.ip; const chk=document.createElement('input'); chk.type="checkbox"; chk.className="sel"; const tdSel=document.createElement('td'); tdSel.appendChild(chk); const tdIP=document.createElement('td'); tdIP.textContent=u.ip||""; const tdMAC=document.createElement('td'); tdMAC.textContent=u.mac||""; const tdHost=document.createElement('td'); tdHost.textContent=u.hostname||""; const tdModel=document.createElement('td'); tdModel.textContent=u.model||""; const tdVer=document.createElement('td'); tdVer.textContent=u.version||""; const tdStatus=document.createElement('td'); tdStatus.appendChild(statusBadge("idle","s-idle-unchanged")); tr.append(tdSel,tdIP,tdMAC,tdHost,tdModel,tdVer,tdStatus); tb.appendChild(tr); unitMap.set(u.ip,{...u,statusCell:tdStatus,versionCell:tdVer}); }); }
function rerenderFiltered(){ renderRows(filteredUnits()); }

async function loadAdapters(){ try{ const res=await api("/api/adapters"); const sel=$("#adapters"); sel.innerHTML=""; const list=(res&&res.adapters)||[]; if(!list.length){ sel.innerHTML=`<option value="">(no adapters found)</option>`; return; } list.forEach(a=>{ const o=document.createElement("option"); o.value=a.scan; o.textContent=`${a.name} — ${a.cidr} (scan: ${a.scan})`; sel.appendChild(o); }); }catch(e){ $("#adapters").innerHTML=`<option value="">(adapters error)</option>`; } }
async function refreshFiles(){ const res=await api("/api/files"); const sel=$("#files"); sel.innerHTML=""; (res.files||[]).forEach(f=>{ const o=document.createElement("option"); o.value=f.name; o.textContent=`${f.name} (${(f.size/1024/1024).toFixed(1)} MB)`; sel.appendChild(o); }); $("#up_status").textContent=res.files?.length?"files refreshed":"no .vpup2 files found"; rerenderFiltered(); }
async function applyConfig(){ const body={ username:$("#username").value||"admin", password:$("#password").value||"Atlona", ws_port:parseInt($("#ws_port").value||"80",10) }; const res=await api("/api/config",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); $("#cfg_status").textContent=res.ok?"config applied":(res.error||"config error"); }
async function clearUnits(){ await api("/api/clear_units",{method:"POST"}); units=[]; unitMap.clear(); rerenderFiltered(); $("#scan_status").textContent="units cleared"; }
async function exportCSV(){ try{ await api("/api/export_csv",{method:"POST"}); }catch(e){} }
function setScanStatusScanning(){ $("#scan_status").innerHTML=`scanning <span class="spinner"></span>`; }
function setScanStatusText(msg){ $("#scan_status").textContent=msg; }
async function loadCache(){ const res=await api("/api/cache"); if(res && res.ok && Array.isArray(res.units) && res.units.length){ units=res.units; rerenderFiltered(); setScanStatusText(`loaded ${units.length} units from cache`); exportCSV(); } }
async function scan(){ const text=($("#targets").value||"").trim(); const chosen=($("#adapters").value||"").trim(); const targets=text||chosen; if(!targets){ setScanStatusText("no targets"); return; } setScanStatusScanning(); const body={targets}; const res=await api("/api/scan",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(res.ok){ units=res.units||[]; const omit=(res.omitted||0); const added=(res.added||0); rerenderFiltered(); setScanStatusText(`scan ok; total unique units: ${units.length}${omit?` (omitted dup MAC this pass: ${omit})`:''}${added?` (added ${added})`:''}`); exportCSV(); } else { setScanStatusText(res.error||"scan error"); } }
function getSelectedIPs(){ const rows=Array.from(document.querySelectorAll("#tbody tr")); const ips=[]; rows.forEach(r=>{ const chk=r.querySelector("input.sel"); if(chk && chk.checked) ips.push(r.dataset.ip); }); return ips; }
function setStatus(ip,text,cls,spin=false){ const row=unitMap.get(ip); if(!row) return; const td=row.statusCell; td.innerHTML=""; td.appendChild(statusBadge(text,cls,spin)); }
async function pollUntilChanged(ip, originalVersion, timeoutMs=15*60*1000){ const start=Date.now(); let sawDown=false; while(Date.now()-start<timeoutMs){ try{ const res=await api("/api/poll",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify({ip})}); if(res && res.ok){ const unit=res.unit||{}; const curV=unit.version||""; if(unit.aliveOnly){ setStatus(ip,"rebooting","s-rebooting",true); await new Promise(r=>setTimeout(r,3000)); continue; } if(!sawDown){ await new Promise(r=>setTimeout(r,1500)); sawDown=true; continue; } if(curV && curV!==originalVersion){ setStatus(ip,"idle","s-idle"); } else { setStatus(ip,"idle (unchanged)","s-idle-unchanged"); } const row=unitMap.get(ip); if(row && curV){ row.versionCell.textContent=curV; } return; } else { if(!sawDown){ sawDown=true; } setStatus(ip,"rebooting","s-rebooting",true); await new Promise(r=>setTimeout(r,3000)); } } catch(e){ if(!sawDown){ sawDown=true; } setStatus(ip,"rebooting","s-rebooting",true); await new Promise(r=>setTimeout(r,3000)); } } setStatus(ip,"idle (timeout)","s-idle-unchanged"); }
async function upgradeSelected(){ const file=$("#files").value; if(!file){ $("#up_status").textContent="select a .vpup2"; return; } const ips=getSelectedIPs(); if(!ips.length){ $("#up_status").textContent="select at least one unit"; return; } $("#up_status").textContent="starting upgrades..."; const concurrency=parseInt($("#concurrency").value||"6",10); const body={ targets:ips, file, username:$("#username").value||"admin", password:$("#password").value||"Atlona", concurrency }; ips.forEach(ip=> setStatus(ip,"sending","s-sending",true)); try{ await api("/api/upgrade",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }catch(e){} for(const ip of ips){ const row=unitMap.get(ip); const originalVersion=(row && row.versionCell && row.versionCell.textContent)||""; pollUntilChanged(ip, originalVersion).catch(()=>{}); } $("#up_status").textContent=`upgrade commands sent (parallel: ${concurrency})`; }

async function doExportAndDownload(){
  try{
    const res = await api("/api/export_csv", { method:"POST" });
    // Trigger download regardless; server also lazily generates on /api/download_csv
    window.location.href = "/api/download_csv";
  }catch(e){
    window.location.href = "/api/download_csv";
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  $("#apply").addEventListener("click", applyConfig);
  $("#scan").addEventListener("click", scan);
  $("#refresh_files").addEventListener("click", refreshFiles);
  $("#upgrade_sel").addEventListener("click", upgradeSelected);
  $("#clear_units").addEventListener("click", clearUnits);
  $("#export_units").addEventListener("click", doExportAndDownload);
  $("#files").addEventListener("change", rerenderFiltered);
  $("#chk_all").addEventListener("change", (e)=>{ document.querySelectorAll("#tbody .sel").forEach(c=> c.checked=e.target.checked); });
  $("#dark_switch").addEventListener("click", toggleDark);
  applyTheme(); loadAdapters(); refreshFiles(); loadCache();
});
</script>
</body>
</html>
