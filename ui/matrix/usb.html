<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Omni USB Matrix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="/ui/favicon.ico"/>
  <link rel="stylesheet" href="/ui/matrix/matrix.css"/>
  <style>
    .tabs{display:flex;gap:0;}
    .tab{padding:8px 16px;cursor:pointer;background:transparent;color:var(--muted);border:none;font-size:14px;font-weight:500;border-bottom:2px solid transparent;transition:all .16s;text-decoration:none;border-radius:6px 6px 0 0}
    .tab:hover{color:var(--fg);background:rgba(30,144,255,.08)}
    .tab.active{color:var(--accent);background:rgba(30,144,255,.08)}
    
    /* USB matrix specific styles */
    .usb-cell{ 
      width:100px; 
      height:40px; 
      text-align:center; 
      vertical-align:middle;
      position:relative;
      cursor:pointer;
      user-select:none;
    }
    .usb-cell:hover{ background:rgba(30,144,255,.05); }
    .usb-cell.paired{ 
      background:rgba(30,144,255,.2); 
      border:2px solid var(--accent);
    }
    .usb-cell.paired:hover{ background:rgba(30,144,255,.3); }
    .usb-cell.disabled{ 
      background:var(--border); 
      cursor:not-allowed;
      opacity:0.4;
    }
    .usb-cell.disabled:hover{ background:var(--border); }
    
    .pair-badge{
      display:inline-block;
      padding:4px 8px;
      border-radius:6px;
      background:var(--accent);
      color:white;
      font-size:12px;
      font-weight:600;
    }
    .pair-badge.empty{
      background:transparent;
      color:var(--muted);
      border:1px dashed var(--border);
    }
    
    .lex-label{
      font-weight:600;
      font-size:13px;
      color:var(--text);
    }
    .rex-label{
      font-weight:600;
      font-size:13px;
      color:var(--text);
    }
    
    /* Override inner dot to be blue for USB (instead of black) */
    #usbMatrix .radio-wrap .dot.audio-on{
      background: var(--video);
    }
    
    /* Override legend inner dot to be blue as well */
    .legend-both::after{
      background: var(--video) !important;
    }
    
    /* USB loading overlay */
    .usb-loading-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:50000;
    }
    .usb-loading-overlay.hidden{
      display:none!important;
    }
    .usb-loading-message{
      color:var(--text);
      text-align:center;
      padding:40px;
      font-size:18px;
    }
    .usb-loading-spinner{
      width:40px;
      height:40px;
      border:4px solid rgba(255,255,255,0.2);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .8s linear infinite;
      margin:0 auto 20px;
    }
    @keyframes spin{
      to{transform:rotate(360deg);}
    }
  </style>
  <script>
    // Apply theme early to avoid flash; guard if body not ready yet
    (function(){
      const dark = localStorage.getItem('dark') !== 'false';
      const apply = ()=>{
        const target = document.body || document.documentElement;
        if(!target) return;
        target.classList.toggle('light', !dark);
      };
      if (document.body) {
        apply();
      } else {
        document.addEventListener('DOMContentLoaded', apply, {once:true});
      }
    })();
  </script>
  
</head>
<body>
  <!-- Header at top -->
  <div class="header">
    <div class="left">
      <img src="/ui/companylogo.png" alt="Company Logo" class="logo">
      <h1>OmniSuite USB Matrix</h1>
    </div>
    <div class="controls">
      <div class="tabs">
        <a href="/" class="tab">Device Manager</a>
        <a href="/matrix" class="tab">A/V Matrix</a>
        <a href="/matrix/usb" class="tab active">USB Matrix</a>
      </div>
      <label class="toggle" id="header_dark_label">
        <input type="checkbox" id="dark_mode_toggle" style="display:none;" />
        <div class="label">Dark Mode</div>
        <div id="dark_switch" class="switch on"><div class="knob"></div></div>
      </label>
    </div>
  </div>

  <div class="top">
    <div class="row">
      <button id="refreshBtn">Refresh</button>
      <div class="divider"></div>
      <label class="toggle" style="margin-left:8px;">
        <input type="checkbox" id="auto_poll_toggle" style="display:none;" />
        <div class="label">Auto-Refresh</div>
        <div id="poll_switch" class="switch"><div class="knob"></div></div>
      </label>
      <label style="margin-left:16px;display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;">
        Interval (seconds):
        <input type="number" id="poll_interval" min="1" max="60" value="5" style="width:60px;padding:4px 8px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:4px;font-size:13px;" />
      </label>
      <div class="divider"></div>
      <label class="toggle" id="sticky_headers_label">
        <input type="checkbox" id="sticky_headers_toggle" style="display:none;" />
        <div class="label">Lock Headers</div>
        <div id="sticky_switch" class="switch"><div class="knob"></div></div>
      </label>
      <div class="divider"></div>
      <div class="legend">
        <div class="legend-item">
          <span class="legend-video-outer"></span>
          <span>Paired</span>
        </div>
        <div class="legend-item">
          <span class="legend-both"></span>
          <span>Paired + Active</span>
        </div>
      </div>
    </div>
  </div>

  <div class="matrix-area">
    <div class="matrix-wrap">
      <table id="usbMatrix" class="matrix" aria-label="USB routing matrix"></table>
    </div>
  </div>

  <div class="collapsible" id="lex-section">
    <div class="header">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <h3 style="margin:0;">LEX Units (Local Extenders)</h3>
    </div>
    <div class="body">
      <div class="tbl-wrap"><table id="lexTbl" class="grid" aria-label="LEX table"></table></div>
    </div>
  </div>

  <div class="collapsible" id="rex-section">
    <div class="header">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <h3 style="margin:0;">REX Units (Remote Extenders)</h3>
    </div>
    <div class="body">
      <div class="tbl-wrap"><table id="rexTbl" class="grid" aria-label="REX table"></table></div>
    </div>
  </div>

  <div id="usb_loading_overlay" class="usb-loading-overlay hidden">
    <div class="usb-loading-message">
      <div class="usb-loading-spinner"></div>
      Please wait while we build the USB Matrix...
    </div>
  </div>

  <script src="/ui/matrix/usb.js"></script>
</body>
</html>
