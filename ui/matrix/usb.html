<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Omni USB Matrix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="/ui/favicon.ico"/>
  <link rel="stylesheet" href="/ui/matrix/matrix.css?v=20260821-usb-subnet"/>
  <style>
    .tabs{display:flex;gap:0;}
    .tab{padding:8px 16px;cursor:pointer;background:transparent;color:var(--muted);border:none;font-size:14px;font-weight:500;border-bottom:2px solid transparent;transition:all .16s;text-decoration:none;border-radius:6px 6px 0 0}
    /* Tab hover and selection live in ui/templates.css. Each page carried its
       own copy painted in a literal blue, so the active tab stayed OmniSuite
       blue under every preset. */
    
    /* USB matrix specific styles */
    .usb-cell{ 
      width:100px; 
      height:40px; 
      text-align:center; 
      vertical-align:middle;
      position:relative;
      cursor:pointer;
      user-select:none;
    }
    .usb-cell:hover{ background:var(--selected-tint); }
    .usb-cell.paired{ 
      background:color-mix(in srgb, var(--state-selection) 28%, transparent); 
      border:2px solid var(--accent);
    }
    .usb-cell.paired:hover{ background:color-mix(in srgb, var(--state-selection) 42%, transparent); }
    .usb-cell.disabled{ 
      background:var(--border); 
      cursor:not-allowed;
      opacity:0.4;
    }
    .usb-cell.disabled:hover{ background:var(--border); }
    
    .pair-badge{
      display:inline-block;
      padding:4px 8px;
      border-radius:6px;
      background:var(--accent);
      color:white;
      font-size:12px;
      font-weight:600;
    }
    .pair-badge.empty{
      background:transparent;
      color:var(--muted);
      border:1px dashed var(--border);
    }
    
    .lex-label{
      font-weight:600;
      font-size:13px;
      color:var(--text);
    }
    .rex-label{
      font-weight:600;
      font-size:13px;
      color:var(--text);
    }
    
    /* Override inner dot to be blue for USB (instead of black) */
    #usbMatrix .radio-wrap .dot.audio-on{
      background: var(--video);
    }
    
    /* Override legend inner dot to be blue as well */
    .legend-both::after{
      background: var(--video) !important;
    }
    
    body.compact .usb-cell{
      width:72px;
      height:28px;
    }
    body.compact .pair-badge{
      padding:2px 6px;
      border-radius:5px;
      font-size:10px;
    }
    body.compact .lex-label,
    body.compact .rex-label{
      font-size:11px;
    }
    body.compact #poll_interval{
      width:48px!important;
      padding:3px 6px!important;
    }

    /* USB loading overlay */
    .usb-loading-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:50000;
    }
    .usb-loading-overlay.hidden{
      display:none!important;
    }
    .usb-loading-message{
      color:var(--text);
      text-align:center;
      padding:40px;
      font-size:18px;
    }
    .usb-loading-spinner{
      width:40px;
      height:40px;
      border:4px solid rgba(255,255,255,0.2);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .8s linear infinite;
      margin:0 auto 20px;
    }
    @keyframes spin{
      to{transform:rotate(360deg);}
    }
    .usb-confirm-backdrop{
      position:fixed;
      inset:0;
      z-index:60000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(0,0,0,.55);
    }
    .usb-confirm-dialog{
      width:min(520px, 100%);
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--card);
      color:var(--text);
      box-shadow:0 18px 50px rgba(0,0,0,.35);
      padding:22px;
    }
    .usb-confirm-dialog h2{
      margin:0 0 12px;
      font-size:20px;
    }
    .usb-confirm-dialog p{
      margin:0;
      color:var(--muted);
      line-height:1.45;
    }
    .usb-confirm-summary{
      margin:18px 0;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .usb-confirm-summary div{
      border:1px solid var(--border);
      border-radius:6px;
      padding:10px;
      background:var(--card);
    }
    .usb-confirm-summary span{
      display:block;
      margin-bottom:4px;
      color:var(--muted);
      font-size:12px;
      text-transform:uppercase;
    }
    .usb-confirm-summary strong{
      font-size:14px;
    }
    .usb-confirm-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }
    .usb-confirm-cancel,
    .usb-confirm-continue{
      border:0;
      border-radius:8px;
      padding:9px 14px;
      color:#fff;
      cursor:pointer;
    }
    .usb-confirm-cancel{
      background:#6b7280;
    }
    .usb-confirm-continue{
      background:var(--accent);
    }
    @media (max-width:560px){
      .usb-confirm-summary{
        grid-template-columns:1fr;
      }
    }
  
td.cell.pending{opacity:.55;cursor:progress;}
td.cell.pending .dot{animation:usbPending 1s ease-in-out infinite;}
@keyframes usbPending{0%,100%{opacity:.35}50%{opacity:1}}
</style>
  <script src="/ui/diagnostics.js?v=20260911-diag"></script>
<link rel="stylesheet" href="/ui/templates.css?v=20260910-templates">
<link rel="stylesheet" href="/ui/settings.css?v=20260911-settings">
<link rel="stylesheet" href="/ui/matrix/usb-matrix.css?v=20260911-usb-frozen">
  <!-- The route grid and both inventory tables overflow sideways; each opts
       its own scroll container in with data-mirror-scroll and gets its own
       synchronised scrollbar above it. -->
  <script src="/ui/mirror-scroll.js?v=20260911-mirror" defer></script>
  <script src="/ui/appearance.js?v=20260910-appearance"></script>
  <script src="/ui/toast.js?v=20260911-toast"></script>
<script src="/ui/settings.js?v=20260911-settings"></script>

  <script>
    // Apply page preferences early to avoid flash; guard if body not ready yet
    (function(){
      const dark = localStorage.getItem('dark') !== 'false';
      const apply = ()=>{
        // The document element, always -- this script runs in <head> on the
        // matrix pages, where document.body is still null. Waiting for
        // DOMContentLoaded meant the first paint used the dark palette and the
        // dark logo even when light was selected, and the page visibly flipped.
        const root = document.documentElement;
        root.classList.toggle('light', !dark);
        if (document.body) {
          document.body.classList.toggle('light', !dark);
        }
      };
      if (document.body) {
        apply();
      } else {
        document.addEventListener('DOMContentLoaded', apply, {once:true});
      }
    })();
  </script>
  
</head>
<body>
  <!-- Header at top -->
  <div class="header">
    <div class="left">
      <img src="/ui/companylogo.png" alt="Company Logo" class="logo">
      <h1>OmniSuite USB Matrix</h1>
    </div>
    <div class="controls">
      <div class="tabs">
        <a href="/" class="tab">Device Info</a>
        <a href="/matrix/configure" class="tab">Configure</a>
        <a href="/matrix" class="tab">A/V Matrix</a>
        <a href="/matrix/usb" class="tab active" aria-current="page">USB Matrix</a>
        <a href="/matrix/multiview" class="tab">Multiview</a>
      </div>
      <button id="header_gear" class="gear-btn" type="button" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </div>

  <div class="top">
    <div class="row">
      <button id="refreshBtn" class="secondary">Refresh</button>
      <div class="divider"></div>
      <label class="toggle" style="margin-left:8px;">
        <input type="checkbox" id="auto_poll_toggle" class="switch-input" />
        <div class="label">Auto-Refresh</div>
        <div id="poll_switch" class="switch"><div class="knob"></div></div>
      </label>
      <label style="margin-left:16px;display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;">
        Interval (seconds):
        <input type="number" id="poll_interval" min="1" max="60" value="5" style="width:60px;padding:4px 8px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:4px;font-size:13px;" />
      </label>
      <div class="divider"></div>
      <label class="toggle" id="sticky_headers_label">
        <input type="checkbox" id="sticky_headers_toggle" class="switch-input" />
        <div class="label">Lock Headers</div>
        <div id="sticky_switch" class="switch"><div class="knob"></div></div>
      </label>
      <div class="divider"></div>
      <div class="legend">
        <div class="legend-item">
          <span class="legend-video-outer"></span>
          <span>Paired</span>
        </div>
        <div class="legend-item">
          <span class="legend-both"></span>
          <span>Paired + Active</span>
        </div>
      </div>
    </div>
  </div>

  <div class="matrix-area">
    <div class="matrix-wrap" data-mirror-scroll>
      <table id="usbMatrix" class="matrix" aria-label="USB routing matrix"></table>
    </div>
  </div>

  <div class="collapsible" id="lex-section">
    <div class="header">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <h3 style="margin:0;">LEX Units (Local Extenders)</h3>
    </div>
    <div class="body">
      <div class="tbl-wrap" data-mirror-scroll><table id="lexTbl" class="grid" aria-label="LEX table"></table></div>
    </div>
  </div>

  <div class="collapsible" id="rex-section">
    <div class="header">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <h3 style="margin:0;">REX Units (Remote Extenders)</h3>
    </div>
    <div class="body">
      <div class="tbl-wrap" data-mirror-scroll><table id="rexTbl" class="grid" aria-label="REX table"></table></div>
    </div>
  </div>

  <div id="usb_loading_overlay" class="usb-loading-overlay hidden">
    <div class="usb-loading-message">
      <div class="usb-loading-spinner"></div>
      Please wait while we build the USB Matrix...
    </div>
  </div>

  <script src="/ui/matrix/usb.js?v=20260910-escfix"></script>
  <script>
    // The frozen REX identity column reserves its own width in the grid's
    // scroll padding, so moving focus into the matrix never parks a route
    // radio underneath it. That width is the *rendered* one -- density, font
    // and zoom each change it, and a literal would be correct in exactly one
    // of those combinations and quietly wrong in the rest. It is therefore
    // measured here and published as --usb-frozen-col-w for usb-matrix.css to
    // consume, the way ui/sticky-columns.js publishes Device Info's offsets.
    //
    // Deliberately no timer: the width changes when something resizes the
    // column or when render() rebuilds the grid, and both of those announce
    // themselves. A poll would repaint forever to observe a value that is
    // usually identical.
    (function(){
      const wrap = document.querySelector('.matrix-area .matrix-wrap');
      const table = document.getElementById('usbMatrix');
      if(!wrap || !table) return;
      const corner = () => table.querySelector('tr > th.row-head');
      let published = '';
      let observed = null;
      const resizer = (typeof ResizeObserver === 'function')
        ? new ResizeObserver(() => measure()) : null;

      function measure(){
        const head = corner();
        if(!head) return;
        const width = Math.round(head.getBoundingClientRect().width);
        // An unlaid-out table measures zero everywhere; publishing that would
        // state a reserve that is wrong rather than merely absent.
        if(!width) return;
        const value = width + 'px';
        if(value === published) return;   // nothing moved; do not touch the DOM
        published = value;
        wrap.style.setProperty('--usb-frozen-col-w', value);
      }

      function attach(){
        const head = corner();
        if(!head || head === observed) return;
        observed = head;
        if(resizer){ resizer.disconnect(); resizer.observe(head); }
      }

      // render() replaces the table's rows wholesale when membership changes,
      // and with them the cell being observed. A state-only refresh rewrites
      // route cells in place and never reaches this, which is the point.
      new MutationObserver(() => { attach(); measure(); })
        .observe(table, {childList: true, subtree: false});

      attach();
      measure();
      // Layout template and appearance both change the column's density.
      new MutationObserver(() => measure())
        .observe(document.documentElement, {attributes: true, attributeFilter: ['data-template', 'class']});
      window.addEventListener('resize', measure, {passive: true});
    })();
  </script>
</body>
</html>
