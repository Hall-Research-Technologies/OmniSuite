name: Build OmniSuite Cross Platform

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Diagnostic build name, with a suffix (example: V1.1.1-diag1). Never publishes."
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      # Matched loosely on purpose. The identity job refuses anything that is not
      # exactly V<number>(.<number>)+, so a mistyped tag fails loudly instead of
      # being silently ignored.
      - "V*"
      - "v*"

jobs:
  # Decide what this run is before anything is built, and refuse to continue when
  # that cannot be established. Two independently maintained products publish to
  # one repository, so a tag, a branch and a version number are each checked
  # against the product this commit belongs to. See tools/release_identity.py.
  identity:
    name: Release identity
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.resolve.outputs.product }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      publish: ${{ steps.resolve.outputs.publish }}
      notes_path: ${{ steps.resolve.outputs.notes_path }}
    steps:
      - name: Checkout (full history, for the branch-ancestry check)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Event inputs reach the script through the environment, never by being
      # interpolated into a shell command: a typed version is untrusted text.
      - name: Resolve and verify the release identity
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.release_version }}
        run: python tools/release_identity.py resolve

  # The full suite on every target that ships an artifact, not only on Linux.
  # A build that cannot pass its own platform's tests must not produce a
  # download for that platform.
  #
  # run_tests.py replaces both hardware transports with recording spies before
  # importing anything, fences GitHub for the lifetime of the process, and fails
  # if a test reaches a routable host. No job here needs a bench and none can
  # touch one.
  test:
    name: Tests (${{ matrix.label }})
    needs: identity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x86_64
          - os: ubuntu-latest
            label: Ubuntu x86_64
          - os: macos-latest
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Record the interpreter this runner actually provides
        shell: bash
        run: |
          python -c "import platform, sys; print('python', sys.version)"
          python -c "import platform; print('machine', platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run every suite, and prove the tests reached no hardware
        shell: bash
        run: |
          set +e
          python run_tests.py 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface what actually failed. A job summary saying only "exit code
            # 1" is useless to anyone without credentials to read the log, and
            # this suite runs on four platforms where the log is the only place
            # a platform-specific failure shows up.
            grep -E '^(FAIL|ERROR):' test-output.txt | head -30 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            grep -E '^[A-Za-z_.]*(Error|Exception):' test-output.txt | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "----- last 60 lines -----"
            tail -60 test-output.txt
          fi
          exit $status

      - name: Keep the test output when a platform fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-${{ matrix.label }}
          path: test-output.txt
          retention-days: 7

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: [identity, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
            artifact_name: Windows-x86_64
            mac_arch: ""
            expect_arch: x86-64
          - os: ubuntu-latest
            suffix: linux
            artifact_name: Ubuntu-x86_64
            mac_arch: ""
            expect_arch: x86-64
          - os: macos-15-intel
            suffix: x86_64
            artifact_name: macOS-x86_64
            mac_arch: x86_64
            expect_arch: x86_64
          - os: macos-latest
            suffix: arm64
            artifact_name: macOS-arm64
            mac_arch: arm64
            expect_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # An artifact's name is not evidence of its architecture. Record what the
      # runner and the interpreter actually are, so the log proves it.
      - name: Record runner and interpreter architecture
        shell: bash
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
          python -c "import platform; print('python machine:', platform.machine())"
          python -c "import sysconfig; print('python platform:', sysconfig.get_platform())"

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-dev libxkbcommon-x11-0 xvfb file

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Use the verified release version
        id: version
        shell: bash
        env:
          VERIFIED_VERSION: ${{ needs.identity.outputs.release_version }}
        run: |
          test -n "$VERIFIED_VERSION" || { echo "::error::no verified release version"; exit 1; }
          echo "release_version=${VERIFIED_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERIFIED_VERSION}"

      - name: Build and package
        env:
          PYI_MACOS_ARCH: ${{ matrix.mac_arch }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          python tools/build_release.py --suffix ${{ matrix.suffix }} --version "${{ steps.version.outputs.release_version }}"

      - name: Check the artifact name belongs to this product
        shell: bash
        run: |
          python tools/release_identity.py verify-assets --dir release --version "${{ steps.version.outputs.release_version }}"

      # `file` on the binary inside the artifact, checked against what this row
      # claims to be. A macOS job running on the wrong runner would otherwise
      # publish an arm64 binary under an Intel name.
      - name: Verify the built executable's architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.suffix }}" in
            linux)  bin="dist/linux/OmniSuite/OmniSuite" ;;
            *)      bin="dist/${{ matrix.suffix }}/OmniSuite.app/Contents/MacOS/OmniSuite" ;;
          esac
          echo "inspecting $bin"
          file "$bin"
          if ! file "$bin" | grep -qi -- "${{ matrix.expect_arch }}"; then
            echo "::error::architecture mismatch: expected ${{ matrix.expect_arch }}"
            exit 1
          fi
          if [ "${{ matrix.suffix }}" = "linux" ]; then
            ldd "$bin" || true
            test -x "$bin" || { echo "::error::executable bit missing"; exit 1; }
          fi

      - name: Verify the built executable's architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("dist/windows/OmniSuite.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          # 0x8664 is IMAGE_FILE_MACHINE_AMD64.
          Write-Host ("PE machine: 0x{0:X4}" -f $machine)
          if ($machine -ne 0x8664) { throw "expected an x86-64 PE, got 0x$('{0:X4}' -f $machine)" }

      # "PyInstaller completed successfully" is not evidence that anything runs.
      # Start the packaged executable, wait for its server, and ask it the
      # questions an operator's first minute would. Linux needs a display for
      # the launcher window, so it runs under Xvfb.
      - name: Smoke-test the packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          # `ls` of two globs where one cannot match exits non-zero -- 2 with GNU
          # coreutils, 1 on macOS -- and under `set -e` that killed this step on
          # every platform before the smoke test ever ran. `find` reports an
          # empty result without failing.
          artifact="$(find release -maxdepth 1 \( -name 'OmniSuite-*.zip' -o -name 'OmniSuite-*.tar.gz' \) | head -1)"
          if [ -z "$artifact" ]; then
            echo "::error::no release artifact found in release/"
            ls -la release || true
            exit 1
          fi
          echo "smoke-testing ${artifact}"
          set +e
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python tools/smoke_release.py --artifact "$artifact" --version "${{ steps.version.outputs.release_version }}" 2>&1 | tee smoke-output.txt
          else
            python tools/smoke_release.py --artifact "$artifact" --version "${{ steps.version.outputs.release_version }}" 2>&1 | tee smoke-output.txt
          fi
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Same reason as the test step: the log needs credentials to read,
            # and "exit code 1" does not say which check failed.
            # Annotations are the only part of a failed run that can be read
            # without credentials, so put the tail there rather than only in
            # the log.
            # GitHub keeps only the first 10 annotations per step, and the
            # line that names the exception is the LAST line of a traceback --
            # so a wide tail drops precisely the line worth reading. Keep it
            # narrow, and lead with the end.
            tail -8 smoke-output.txt | grep -v '^[[:space:]]*$' | (tac 2>/dev/null || tail -r) | while IFS= read -r line; do
              echo "::error::${line}"
            done
            tail -60 smoke-output.txt
          fi
          exit $status

      - name: Keep the smoke output when a platform fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-output-${{ matrix.artifact_name }}
          path: smoke-output.txt
          retention-days: 7

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ needs.identity.outputs.product }}-${{ matrix.artifact_name }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    # `needs: build` requires the WHOLE matrix to succeed, so a failure on any
    # declared target stops publication rather than shipping a partial set.
    # Only an identity-verified tag publishes. A dispatch, or a push to a branch, never
    # does, whatever its version says.
    if: needs.identity.outputs.publish == 'true' && github.ref_type == 'tag'
    needs: [identity, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          # Only this product's artifacts. The pattern names the product, so another
          # product's run can never be collected into this release.
          pattern: release-${{ needs.identity.outputs.product }}-*
          merge-multiple: true
          path: release-assets

      # One file listing every distributable archive, in the format
      # `sha256sum -c` understands, built from the per-artifact sums each build
      # job produced from the archive it actually uploaded.
      - name: Assemble SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      # Every declared target must be present, and every file must be this
      # product's, for this version, before anything is published.
      - name: Verify every artifact belongs to this release
        run: |
          python tools/release_identity.py verify-assets --dir release-assets --version "${{ needs.identity.outputs.release_version }}" --complete

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ needs.identity.outputs.notes_path }}
          files: release-assets/*
