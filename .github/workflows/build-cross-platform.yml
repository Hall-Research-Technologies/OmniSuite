name: Build OmniSuite Cross Platform

# DIAGNOSTIC BRANCH ONLY (ci-diag-macos). Not a release workflow: it has no tag trigger, no
# publish job and no write permission, and it exists only to explain a macOS test failure.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Diagnostic run name (example: V1.2.0-diag2). Never publishes."
        required: false
        type: string

jobs:
  diag:
    name: macOS arm64 launcher diagnostic
    if: github.repository == vars.OMNI_CI_REPOSITORY
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Facts and a minimal Tk plus thread plus HTTP reproduction (no application code)
        shell: bash
        run: |
          cat > /tmp/probe_facts.py <<'PYEOF'
          import json, os, platform, socket, sys, threading, time, urllib.request, http.server
          print("python", sys.version)
          print("platform", platform.platform(), platform.machine())
          import tkinter as tk
          print("tk", tk.TkVersion, "tcl", tk.TclVersion)
          print("proxy env", {k: v for k, v in os.environ.items() if "proxy" in k.lower()})
          print("localhost ->", socket.getaddrinfo("localhost", 80))
          t = time.time(); s = socket.create_server(("127.0.0.1", 0)); p = s.getsockname()[1]
          c = socket.create_connection(("127.0.0.1", p), timeout=3); print("plain loopback connect ok %.3fs" % (time.time() - t)); c.close(); s.close()
          for mod in ("flask", "werkzeug", "pystray", "cryptography"):
              try:
                  m = __import__(mod); print(mod, getattr(m, "__version__", "?"))
              except Exception as e:
                  print(mod, "IMPORT FAILED", type(e).__name__, e)
          PYEOF
          python /tmp/probe_facts.py

          cat > /tmp/probe_tk_http.py <<'PYEOF'
          # No OmniSuite code at all: does a Tk main loop, a worker thread that calls root.after, and a
          # plain HTTP server in a thread behave on this runner the way the launcher tests assume?
          import json, sys, threading, time, urllib.request, http.server, os, faulthandler
          faulthandler.dump_traceback_later(100, exit=True)
          import tkinter as tk
          root = tk.Tk(); root.withdraw()
          R = {}
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
              def log_message(self, *a): pass
          def pump(cond, timeout=10.0):
              end = time.time() + timeout
              while time.time() < end:
                  root.update()
                  if cond(): return True
                  time.sleep(0.02)
              return False
          def scenario():
              try:
                  srv = http.server.ThreadingHTTPServer(("127.0.0.1", 0), H)
                  port = srv.server_address[1]
                  threading.Thread(target=srv.serve_forever, daemon=True).start()
                  # 1. blocking GET from the Tk main thread, inside an after callback (what the tests do)
                  t = time.time()
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:%d/" % port, timeout=3) as r:
                          R["blocking_get"] = "%s %.3fs" % (r.status, time.time() - t)
                  except Exception as e:
                      R["blocking_get"] = "FAILED %r %.3fs" % (e, time.time() - t)
                  # 2. a worker thread calls root.after while the main thread pumps root.update()
                  flag = []
                  def worker():
                      t0 = time.time(); root.after(0, lambda: flag.append(1)); R["worker_after_returned"] = "%.3fs" % (time.time() - t0)
                  threading.Thread(target=worker, daemon=True).start()
                  t0 = time.time(); R["after_serviced_by_update"] = pump(lambda: bool(flag), 8); R["after_wait"] = "%.3fs" % (time.time() - t0)
                  # 3. the same, while the main thread is blocked in a GET (the tests' pattern)
                  flag2 = []
                  def worker2():
                      t0 = time.time(); root.after(0, lambda: flag2.append(1)); R["worker2_after_returned"] = "%.3fs" % (time.time() - t0)
                  threading.Thread(target=worker2, daemon=True).start()
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:%d/" % port, timeout=3) as r:
                          R["get_while_worker_pending"] = str(r.status)
                  except Exception as e:
                      R["get_while_worker_pending"] = "FAILED %r" % (e,)
                  R["after2_serviced"] = pump(lambda: bool(flag2), 8)
              except BaseException:
                  import traceback; traceback.print_exc()
              print("RESULT " + json.dumps(R, indent=1)); sys.stdout.flush(); os._exit(0)
          root.after(0, scenario)
          root.mainloop()
          PYEOF
          python /tmp/probe_tk_http.py

      - name: The product's own server alone (no Tk, no launcher)
        shell: bash
        run: |
          cat > /tmp/probe_server.py <<'PYEOF'
          import os, sys, time, threading, urllib.request, faulthandler
          faulthandler.dump_traceback_later(80, exit=True)
          sys.path.insert(0, os.getcwd())
          from flask import Flask
          import omni_remote
          a = Flask("s")
          @a.route("/h")
          def h(): return "ok"
          t = time.time()
          httpd = omni_remote.serve_tagged("127.0.0.1", 0, a, threaded=True)
          port = httpd.server_port
          threading.Thread(target=httpd.serve_forever, daemon=True).start()
          print("serve_tagged bound", port, "%.3fs" % (time.time() - t))
          for i in range(3):
              t = time.time()
              try:
                  r = urllib.request.urlopen("http://127.0.0.1:%d/h" % port, timeout=5); print("GET ok", r.status, "%.3fs" % (time.time() - t))
              except Exception as e:
                  print("GET failed", repr(e), "%.3fs" % (time.time() - t))
          os._exit(0)
          PYEOF
          python /tmp/probe_server.py

      - name: The launcher tests, with the full stdout and stderr of every scenario printed
        shell: bash
        run: |
          cat > /tmp/diag_run.py <<'PYEOF'
          import json, os, subprocess, sys, time, unittest
          ROOT = os.getcwd(); sys.path.insert(0, ROOT)
          import tests                      # installs the hardware fence, exactly as the suite does
          import tests.test_local_port_launcher as T
          real_run = subprocess.run
          def recording_run(*a, **k):
              scenario = bool(a) and isinstance(a[0], list) and len(a[0]) > 2 and a[0][1] == "-c" and "root.mainloop()" in str(a[0][2])
              t0 = time.time()
              try:
                  p = real_run(*a, **k)
              except subprocess.TimeoutExpired as exc:
                  if scenario:
                      print("##### SCENARIO TIMEOUT %.1fs
--- stdout ---
%s
--- stderr ---
%s" % (time.time() - t0, str(exc.stdout)[-6000:], str(exc.stderr)[-3000:]))
                  raise
              if scenario:
                  print("##### SCENARIO %.1fs exit=%s
--- stdout (launcher log lines) ---
%s
--- stderr tail ---
%s" % (time.time() - t0, p.returncode, (p.stdout or "")[-6000:], (p.stderr or "")[-1500:])); sys.stdout.flush()
              return p
          subprocess.run = recording_run
          T.subprocess.run = recording_run
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(T.LauncherTests)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print("TESTS RUN %d FAILURES %d ERRORS %d SKIPPED %d" % (result.testsRun, len(result.failures), len(result.errors), len(result.skipped)))
          PYEOF
          python /tmp/diag_run.py > diag-output.txt 2>&1 || true
          cat diag-output.txt | cut -c1-400

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: diag-output-macos
          path: diag-output.txt
          retention-days: 3
          if-no-files-found: warn
